<style>

.code{font-weight:700;letter-spacing:.12em;background:var(--gs);padding:2px 8px;border-radius:6px}

.q{font-size:1.2rem;line-height:1.4}

.nav2{display:flex;justify-content:space-between;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
.sc{overflow-x:auto}
@media (max-width:420px){.g2{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}.chips button{flex:none;padding:8px 14px;border:2px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;font-weight:700}.chips button.on{background:var(--g);border-color:var(--g);color:var(--gt)}.chk{display:flex;align-items:center;gap:10px;padding:8px 0}.chk input{width:22px;height:22px;margin:0;flex:none}.sm{padding:3px 10px!important}

@media print{.noprint,.tabs,.chips,h1{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0}.wrap{max-width:none}}
</style></head>

async function raw(path,o={}){
 const h={apikey:PK,"Content-Type":"application/json"};
 if(o.jwt)h.Authorization="Bearer "+o.jwt;
 if(o.prefer)h.Prefer=o.prefer;
 let r;try{r=await fetch(SB+path,{method:o.method||"GET",headers:h,body:o.body?JSON.stringify(o.body):undefined})}catch(e){throw new Error("No connection. Check your internet and try again.")}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.msg||j.error_description||j.error))||"Something went wrong ("+r.status+")");
 return j;
}

 if(sess&&sess.exp<Date.now()/1e3+60){try{keep(await raw("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:sess.refresh_token}}))}catch(e){setSess(null);throw new Error("Please sign in again.")}}
 return raw("/rest/v1/"+path,{...o,jwt:sess&&sess.access_token});

function toData(im,c,mx){c=c||{l:0,r:0,t:0,b:0};mx=mx||900;
 const sx=im.width*c.l,sy=im.height*c.t,sw=im.width*(1-c.l-c.r),sh=im.height*(1-c.t-c.b),sc=Math.min(1,mx/Math.max(sw,sh)),cv=document.createElement("canvas");
 cv.width=Math.max(1,Math.round(sw*sc));cv.height=Math.max(1,Math.round(sh*sc));
 const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,sx,sy,sw,sh,0,0,cv.width,cv.height);

 if(d.length>280000&&mx>300)return toData(im,c,mx*.75);return d}

 document.body.appendChild(o);const c={l:0,r:0,t:0,b:0},cv=o.querySelector("#cvp");
 const draw=()=>{const sx=im.width*c.l,sy=im.height*c.t,sw=im.width*(1-c.l-c.r),sh=im.height*(1-c.t-c.b),sc=Math.min(1,560/sw);cv.width=Math.max(1,Math.round(sw*sc));cv.height=Math.max(1,Math.round(sh*sc));cv.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,cv.width,cv.height)};
 draw();o.addEventListener("input",e=>{const k=e.target.dataset.k;if(k){c[k]=e.target.value/100;draw()}});
 o.addEventListener("click",e=>{const d=e.target.dataset.d;if(d){o.remove();res(d==="ok"?c:null)}})})}

 const w=(el,id,rm,ex2)=>{const e=$(el);if(!e)return;e.innerHTML=id&&IMG[id]?`<img src="${IMG[id]}" alt="" style="max-height:80px;max-width:100%;border:1px solid var(--line);background:#fff;display:block;margin:4px 0"><button class="b o sm" data-a="${rm}" ${ex2}>Remove image</button>`:""};
 w("#qpv",f.m,"rmQ",'data-w="m"');w("#fpv",f.f,"rmQ",'data-w="f"');[0,1,2,3].forEach(i=>w("#opv"+i,f.o[i],"rmO",`data-i="${i}"`))}

 try{const d=toData(im,c),id=await rpc("teacher_add_image",{p_token:tk,p_exam:T.ex.id,p_data:d});IMG[id]=d;return id}finally{const u2=$("#upl");if(u2)u2.textContent=""}}

function secProfile(){const p=S.school;return `<div class="card"><h2>School code</h2><p class="mut">Students use this code, their admission number and a PIN to open their profile.</p><p><span class="code">${esc(p.school_code)}</span></p></div><div class="card"><h2>School profile</h2><input id="pn" placeholder="School name" value="${esc(p.name)}"><input id="pa" placeholder="Address" value="${esc(p.address)}"><input id="pp" placeholder="Phone" inputmode="tel" value="${esc(p.phone)}"><div class="g2"><input id="ps" placeholder="Session, e.g. 2026/2027" value="${esc(p.current_session)}"><input id="pt" placeholder="Term, e.g. First Term" value="${esc(p.current_term)}"></div><button class="b" data-a="saveP">Save profile</button></div>`}

function student(){
 if(st.step==="login"){const pm=st.mode==="profile";return `<div class="chips"><button class="${pm?"":"on"}" data-a="smode" data-v="code">Exam code</button><button class="${pm?"on":""}" data-a="smode" data-v="profile">My profile</button></div>`+(pm?`<div class="card"><h2>My profile</h2><input id="pc" placeholder="School code" autocapitalize="characters" autocomplete="off"><input id="pa2" placeholder="Admission number" autocomplete="off"><input id="pp2" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"><button class="b" data-a="plogin">Open my profile</button></div>`:`<div class="card"><h2>Enter your exam code</h2><input id="sc" inputmode="numeric" placeholder="Exam code" autocomplete="off" autocapitalize="off" autocorrect="off"><button class="b" data-a="login">Continue</button></div>`)}
 if(st.step==="dash")return dash(st.d);
 if(st.step==="prun")return prun();
 if(st.step==="pdone")return pdone();
 if(st.step==="pload")return `<div class="card"><p id="pl" class="mut">Loading practice…</p></div>`;
 if(st.step==="lobby"){const r=st.r;
 return `<div class="card"><h2>${esc(r.student_name)}</h2><p>${esc(r.class_name)} · <b>${esc(r.subject)}</b></p><p class="mut">${r.question_count} questions · ${r.duration_mins} minutes</p>${r.instructions?`<p style="white-space:pre-wrap">${esc(r.instructions)}</p>`:""}${r.message?`<p class="note bad">${esc(r.message)}</p>`:""}<p class="mut" id="pl">${r.can_start&&!st.ready?"Loading pictures…":""}</p><button class="b" data-a="go"${r.can_start&&st.ready?"":" disabled"}>${r.resume?"Continue exam":"Start exam"}</button> ${r.can_start?"":`<button class="b o" data-a="login">Check again</button> `}<button class="b o" data-a="again">Not me</button></div>`}
 if(st.step==="run"){const r=ex.r,qs=r.questions,i=ex.i,n=qs.length,q=qs[i];
 return `<div class="tmbar"><span>${esc(r.subject)}</span><span id="tm"></span></div><div class="card"><p class="mut">Question ${i+1} of ${n}</p><p class="q">${esc(q.body)}</p>${qImg(q)}
 ${q.kind==="mcq"?q.options.map((o,j)=>optHtml(o,j,ex.ans[i]===j,"pick")).join(""):q.kind==="fill"?`<input id="fi" placeholder="Type your answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(ex.ans[i]||"")}">`:`<textarea id="th" rows="7" placeholder="Write your answer">${esc(ex.ans[i]||"")}</textarea>`}
 <div class="nav2"><button class="b o" data-a="prev"${i?"":" disabled"}>Previous</button>${i<n-1?`<button class="b" data-a="next">Next</button>`:`<button class="b" data-a="fin">Submit exam</button>`}</div></div>`}
 const r=st.r;return `<div class="card"><h2>Exam submitted</h2><p>Thank you, ${esc(r.student_name)}. Your answers have been saved.</p><p class="mut">Please leave the computer for the next student.</p><button class="b o" data-a="again">Done</button></div>`;
}
function render(){

 $("#app").innerHTML=`<h1>SBT <small class="mut" style="font-weight:400">School Based Test</small></h1>${view==="teacher"?"":`<div class="tabs">${["student","school"].map(x=>`<button class="${view===x?"on":""}" data-a="view" data-v="${x}">${x==="student"?"Student":"School"}</button>`).join("")}</div>`}${msg?`<p class="note${msg.bad?" bad":""}">${esc(msg.t)}</p>`:""}${v}`;
 msg=null;if(st.step==="run"&&view==="student"&&ex)tick();if(view==="teacher"&&T&&T.ex)setPv();
}
const remain=()=>ex.end-Date.now();
function tick(){const r=Math.max(0,remain()),m=Math.floor(r/6e4),s=Math.floor(r/1e3)%60,t=$("#tm");if(t)t.textContent=m+":"+String(s).padStart(2,"0");if(!r&&!ex.over){ex.over=1;finish()}}
function keepAns(){try{localStorage.setItem("cbt-ans-"+ex.r.attempt_id,JSON.stringify(ex.ans))}catch(e){}clearTimeout(ex.t);ex.t=setTimeout(()=>rpc("student_save",{p_attempt:ex.r.attempt_id,p_answers:ex.ans}).catch(()=>{}),1500)}
async function finish(){
 try{const res=await rpc("student_submit",{p_attempt:ex.r.attempt_id,p_answers:ex.ans});clearInterval(timer);try{localStorage.removeItem("cbt-ans-"+ex.r.attempt_id)}catch(e){}st={step:"done",r:res};ex=null;render();setTimeout(()=>{if(st.step==="done"){st={step:"login"};render()}},8000)}
 catch(e){note(e.message+" Your answers are saved on this device. Tap Submit exam to try again.",1);render()}
}
