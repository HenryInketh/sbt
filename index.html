function syncBulk(){const B=T.bulk;if(!B)return;T.bt=val("#bt");B.forEach((b,i)=>{if(!$("#bq"+i))return;b.q=val("#bq"+i);b.o=[0,1,2,3].map(j=>val("#bo"+i+"_"+j));const k=val("#bk"+i);b.ans=k===""?null:+k;b.topic=val("#bp"+i)})}
function bulkSet(t){T.bulk=parseMcq(t,(T.qs||[]).map(x=>x.body));if(!T.bulk.length){T.bulk=null;throw new Error("I could not find any questions. Check the pattern shown above, or tap Show an example.")}render()}
function bulkView(){const B=T.bulk,room=Math.max(0,60-T.qs.length),ready=B.filter(b=>b.ok).length;

const SECS=["Profile","Classes","Students","Teachers","Exams","Results","Insights","Account"];
const chk=(l,on,a,at)=>`<label class="chk"><input type="checkbox" ${on?"checked":""} data-a="${a}" ${at}> ${esc(l)}</label>`;
const nm=(arr,id)=>{const x=arr.find(y=>y.id===id);return x?x.name:"—"};
const tlink=t=>location.href.split("#")[0]+"#teacher-"+t.access_token;
const lst=v=>v.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);

function school(){
 if(rec)return `<div class="card"><h2>Set your password</h2><input id="rp1" type="password" placeholder="New password (8 or more characters)" autocomplete="new-password"><input id="rp2" type="password" placeholder="Repeat new password" autocomplete="new-password"><button class="b" data-a="recSet">Save new password</button></div>`;
 if(!sess)return `<div class="card"><h2>School sign in</h2><p class="mut">Schools are registered by SBT. Sign in with the email we registered for your school. First time? Open the invite link we emailed you to set your password.</p><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password"><button class="b" data-a="signin">Sign in</button><p><button class="b o sm" data-a="forgot">Forgot password?</button></p></div>`;
 if(!S)return `<p class="mut">Loading…</p>`;
 const so=`<p><button class="b o" data-a="out">Sign out</button></p>`;
 const own=S.adm?`<div class="card"><h2>Add a school</h2><input id="asn" placeholder="School name"><input id="ase" type="email" placeholder="School administrator's email" autocomplete="off"><input id="asp" inputmode="tel" placeholder="Phone (optional)"><button class="b" data-a="addSchool">Add school</button><p class="mut">The school gets its school code right away, and the administrator is emailed an invite to set a password.</p></div><div class="card"><h2>All schools (${S.all.length})</h2>${S.all.length?S.all.map(x=>`<div class="row" style="display:block"><b>${esc(x.name)}</b> <span class="tag ${x.approved?"ok":""}">${x.approved?"Active":"Suspended"}</span><p class="mut" style="margin:2px 0 6px">School code <b class="code">${esc(x.school_code)}</b> · ${esc(x.owner_email||"")} · ${x.owner_id?"Administrator signed in":"Waiting for administrator"}</p><button class="b${x.approved?" o":""}" data-a="ap" data-id="${x.id}" data-v="${x.approved?0:1}">${x.approved?"Suspend":"Reactivate"}</button>${x.owner_id?"":` <button class="b o" data-a="reinvite" data-id="${x.id}">Send invite again</button>`}</div>`).join(""):`<p class="mut">No schools yet.</p>`}</div>`:"";
 if(!S.school)return S.adm?own+so:`<div class="card"><h2>Not registered</h2><p>This email has not been registered with a school. Please contact SBT to have your school added.</p></div>`+so;
 if(!S.school.approved)return own+`<div class="card"><h2>${esc(S.school.name)}</h2><p>Your school's access is switched off. Please contact SBT.</p></div>`+so;
 if(S.pins)return pinSheet();
 if(S.sheet)return sheetView();
 const secs=SECS.concat(S.adm?["Schools"]:[]);
 const body={Profile:secProfile,Classes:secClasses,Students:secStudents,Teachers:secTeachers,Exams:secExams,Results:secResults,Insights:secInsights,Account:secAccount,Schools:()=>own}[sec]();
 return `<p class="row"><b>${esc(S.school.name)}</b><button class="b o sm" data-a="out">Sign out</button></p><div class="chips">${secs.map(x=>`<button class="${sec===x?"on":""}" data-a="sec" data-v="${x}">${x}</button>`).join("")}</div>`+body;
}
function secProfile(){const p=S.school;return `<div class="card"><h2>School code</h2><p class="mut">Students use this code, their admission number and a PIN to open their profile.</p><p><span class="code">${esc(p.school_code)}</span></p></div><div class="card"><h2>School profile</h2><input id="pn" placeholder="School name" value="${esc(p.name)}"><input id="pa" placeholder="Address" value="${esc(p.address)}"><input id="pp" placeholder="Phone" inputmode="tel" value="${esc(p.phone)}"><div class="g2"><input id="ps" placeholder="Session, e.g. 2026/2027" value="${esc(p.current_session)}"><input id="pt" placeholder="Term, e.g. First Term" value="${esc(p.current_term)}"></div><button class="b" data-a="saveP">Save profile</button></div>`}
function secClasses(){
 const{classes,subjects,cs,students}=S;
 return `<div class="card"><h2>Subjects (${subjects.length})</h2>${subjects.map(x=>`<div class="row" style="display:block"><b>${esc(x.name)}</b> <button class="b o sm" data-a="opn" data-id="${x.id}">Question types</button>${opn===x.id?`<div style="margin-top:8px"><p class="mut" style="margin:0">Teachers can only use the types you leave on.</p>${chk("Image questions and options",x.allow_images,"togT",`data-s="${x.id}" data-f="allow_images"`)}${chk("Fill in the gap",x.allow_fill,"togT",`data-s="${x.id}" data-f="allow_fill"`)}${chk("Theory",x.allow_theory,"togT",`data-s="${x.id}" data-f="allow_theory"`)}</div>`:""}</div>`).join("")||`<p class="mut">None yet</p>`}<input id="sb" placeholder="Add subjects, separated by commas"><button class="b" data-a="addSub">Add subjects</button></div>
 <div class="card"><h2>Classes (${classes.length})</h2>${classes.map(c=>`<div class="row" style="display:block"><b>${esc(c.name)}</b>${c.jamb_mode?` <span class="tag ok">JAMB</span>`:""} <small>${students.filter(x=>x.class_id===c.id).length} students · ${cs.filter(x=>x.class_id===c.id).length} subjects</small> <button class="b o sm" data-a="opn" data-id="${c.id}">Subjects</button>${opn===c.id?`<div style="margin-top:8px">${chk("JAMB practice mode (students see a JAMB-style estimate)",c.jamb_mode,"togJ",`data-c="${c.id}"`)}<p class="mut" style="margin:8px 0 0">Subjects this class offers</p>${subjects.map(x=>chk(x.name,cs.some(y=>y.class_id===c.id&&y.subject_id===x.id),"togCS",`data-c="${c.id}" data-s="${x.id}"`)).join("")||'<p class="mut">Add subjects first.</p>'}</div>`:""}</div>`).join("")}
 <input id="cn" placeholder="Add classes, separated by commas, e.g. SS 2A, SS 2B"><button class="b" data-a="addCls">Add classes</button></div>`;
}
function secStudents(){
 const{students,classes,subjects,ss}=S;
 return `<div class="card"><h2>Add students</h2><textarea id="sl" rows="3" placeholder="One per line: admission no, name, class&#10;S003, Chika Eze, SS 2A"></textarea><button class="b" data-a="addS">Save students</button><p class="mut">Adding a student again updates their name or class.</p></div>
 <div class="card"><h2>Student PINs</h2><p class="mut">Students sign in to their profile with the school code, their admission number and a PIN. A PIN is shown only once, so print or screenshot it.</p><button class="b" data-a="mkPins">Make PINs for students without one</button></div>
 <div class="card"><h2>Students (${students.length})</h2>${students.map(x=>`<div class="row" style="display:block"><b>${esc(x.name)}</b> <small>${esc(x.admission_no)} · ${esc(nm(classes,x.class_id))}</small> <button class="b o sm" data-a="opn" data-id="${x.id}">Subjects</button> <button class="b o sm" data-a="newPin" data-id="${x.id}">New PIN</button>${opn===x.id?`<div style="margin-top:8px">${subjects.map(y=>chk(y.name,ss.some(z=>z.student_id===x.id&&z.subject_id===y.id),"togSS",`data-st="${x.id}" data-s="${y.id}"`)).join("")||'<p class="mut">Add subjects first.</p>'}</div>`:""}</div>`).join("")||'<p class="mut">No students yet.</p>'}</div>`;
}
function secTeachers(){
 const{teachers,subjects,classes}=S;
 return `<div class="card"><h2>Add teacher</h2><div class="g2"><input id="tn" placeholder="Teacher name"><input id="tw" inputmode="numeric" placeholder="WhatsApp, e.g. 2348012345678"></div><button class="b" data-a="addT">Add teacher</button></div>`+teachers.map(t=>`<div class="card"><b>${esc(t.name)}</b> <span class="tag ${t.active?"ok":""}">${t.active?"Active":"Revoked"}</span><p class="mut" style="margin:2px 0 8px">${esc(t.whatsapp)}</p>
 ${t.teacher_assignments.map(a=>`<p class="row"><span>${esc(nm(subjects,a.subject_id))} · ${esc(nm(classes,a.class_id))}</span><button class="b o sm" data-a="delAs" data-t="${t.id}" data-s="${a.subject_id}" data-c="${a.class_id}">Remove</button></p>`).join("")}
 <div class="g2" style="margin-top:8px"><select id="as${t.id}">${subjects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><select id="ac${t.id}">${classes.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><button class="b o" data-a="addAs" data-t="${t.id}">Assign subject</button>
 <p style="margin-top:12px"><a class="b o" target="_blank" rel="noopener" href="https://wa.me/${esc(t.whatsapp)}?text=${encodeURIComponent("Hello "+t.name+", this is your personal link for entering exam questions: "+tlink(t))}">Send link on WhatsApp</a> <button class="b o" data-a="actv" data-id="${t.id}" data-v="${t.active?0:1}">${t.active?"Revoke link":"Reactivate"}</button> <button class="b o" data-a="rst" data-id="${t.id}">Reset link</button> <button class="b o" data-a="rmT" data-id="${t.id}">Remove teacher</button></p></div>`).join("");
}
function xstat(e){if(e.kind==="practice")return e.status==="awaiting"?["Practice · draft",""]:e.status==="submitted"?["Practice · ready to approve",""]:["Practice · live","ok"];return e.status==="awaiting"?["Draft with teacher",""]:e.status==="submitted"?["Ready to approve",""]:!e.closes_at?["Approved · not scheduled",""]:e.is_open?["OPEN","ok"]:["Scheduled","ok"]}
function secExams(){
 if(xd){const e=S.exams.find(x=>x.id===xd);if(e)return detail(e)}
 const{exams,teachers,subjects,classes}=S,o=[];
 teachers.forEach(t=>t.teacher_assignments.forEach(a=>o.push(`<option value="${t.id}|${a.subject_id}|${a.class_id}">${esc(t.name)} — ${esc(nm(subjects,a.subject_id))} · ${esc(nm(classes,a.class_id))}</option>`)));
 return `<div class="card"><h2>New exam</h2>${o.length?`<select id="xa">${o.join("")}</select><select id="xk"><option value="exam">Exam</option><option value="practice">Practice set</option></select><button class="b" data-a="addE">Create</button>`:`<p class="mut">Assign a subject and class to a teacher first.</p>`}</div>
 <div class="card"><h2>Exams</h2>${exams.length?exams.map(e=>{const n=e.questions&&e.questions[0]?e.questions[0].count:0,x=xstat(e);
 return `<div class="row" style="display:block"><b>${esc(e.subject)} · ${esc(e.class_name)}</b> <span class="tag ${x[1]}">${x[0]}</span>
 <p class="mut" style="margin:4px 0">${e.results_released?"✓ Results published · ":""}${n} questions${e.closes_at?` · ${fmt(e.starts_at)} to ${fmt(e.closes_at)} · ${e.duration_mins} min each`:""}</p>
 <select data-chg="re" data-id="${e.id}" aria-label="Teacher"><option value="">No teacher</option>${teachers.map(t=>`<option value="${t.id}"${t.id===e.teacher_id?" selected":""}>${esc(t.name)}</option>`).join("")}</select>
 ${e.status==="submitted"?`<button class="b" data-a="pub" data-id="${e.id}">Approve exam</button> `:""}${e.status==="approved"&&e.kind!=="practice"?`<button class="b" data-a="xd" data-id="${e.id}">${e.closes_at?"Manage exam":"Schedule exam"}</button> `:""}${e.status==="approved"&&e.closes_at&&e.kind!=="practice"?`<button class="b${e.results_released?" o":""}" data-a="rel" data-id="${e.id}" data-v="${e.results_released?0:1}">${e.results_released?"Hide results":"Publish results"}</button> `:""}${e.status!=="awaiting"?`<button class="b o" data-a="ret" data-id="${e.id}">Return to teacher</button>`:""}</div>`}).join(""):`<p class="mut">No exams yet.</p>`}</div>`;
}
function aiCard(e){const ai=S.ai;
 return `<div class="card"><h2>AI marking</h2>${ai?`<p class="mut">${ai.marked} marked · ${ai.pending} waiting · ${ai.unconfirmed} to confirm</p>${ai.missing_schemes&&ai.missing_schemes.length?`<p class="note bad">Theory question ${ai.missing_schemes.join(", ")} has no marking scheme yet. Ask the teacher to add one.</p>`:""}`:`<p class="mut">Not available yet.</p>`}<button class="b" data-a="aiRun" data-id="${e.id}">Mark with AI</button> <button class="b o" data-a="aiReview" data-id="${e.id}">Review marks</button>${ai&&ai.unconfirmed?` <button class="b o" data-a="aiHigh" data-id="${e.id}">Confirm clear marks</button>`:""}<p id="aip" class="mut"></p></div>`}
function reviewView(e){const L=S.am;
 return `<div class="card"><button class="b o sm" data-a="aiBack">Back</button> <b>Review marks · ${esc(e.subject)} · ${esc(e.class_name)}</b><p class="mut">${L.length} to confirm. Doubtful marks come first.</p></div>`+(L.length?L.map(m=>{const nm2=m.attempts&&m.attempts.students?m.attempts.students.name:"Student";
  return `<div class="card"><p class="mut">${esc(nm2)} · Question ${m.questions?m.questions.position:""} <span class="tag ${m.confidence==="high"?"ok":m.confidence==="low"?"bad":""}">${m.confidence}</span>${(m.flags||[]).length?` <span class="tag bad">${esc(m.flags.join(", "))}</span>`:""}</p><p><b>${esc(m.questions?m.questions.body:"")}</b></p><p style="white-space:pre-wrap">${esc(m.answer)}</p>${(m.points||[]).map(p=>`<p class="mut" style="margin:2px 0">${p.awarded}/${p.marks} · ${esc(p.text)}${p.evidence?` · “${esc(p.evidence)}”`:""} · ${esc(p.reason)}</p>`).join("")||`<p class="mut">${esc(m.reason||"")}</p>`}<div class="g2"><input id="am-${m.id}" type="number" min="0" max="${m.max_marks}" step="0.5" value="${m.suggested_marks}" aria-label="Marks"><button class="b" data-a="aiConfirm" data-id="${m.id}">Confirm (out of ${m.max_marks})</button></div></div>`}).join(""):`<div class="card"><p class="mut">Nothing waiting. All AI marks are confirmed.</p></div>`);
}
function detail(e){
 if(S.am)return reviewView(e);
 const xc=(S.xc||[]).slice().sort((a,b)=>a.students.name.localeCompare(b.students.name)),at=S.xa||[];
 const stt=c=>{const a=at.find(x=>x.student_id===c.student_id);return !a?"Not started":a.submitted_at?"Submitted":"In progress"};
 const cnt=k=>xc.filter(c=>stt(c)===k).length;
 const loc=d=>new Date(new Date(d).getTime()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
 const x=xstat(e);
 return `<div class="card"><button class="b o sm" data-a="xback">Back</button> <b>${esc(e.subject)} · ${esc(e.class_name)}</b> <span class="tag ${x[1]}">${x[0]}</span></div>
 <div class="card"><h2>${e.closes_at?"Schedule":"Set the schedule"}</h2>
 <p class="mut">Exam opens</p><input id="xs" type="datetime-local" value="${loc(e.closes_at?e.starts_at:new Date())}">
 <p class="mut">Exam closes</p><input id="xc" type="datetime-local" value="${loc(e.closes_at||new Date(Date.now()+6*36e5))}">
 <p class="mut">Minutes per student</p><input id="xm" type="number" min="5" value="${e.duration_mins}">
 <textarea id="xi" rows="3" placeholder="Instructions shown to students">${esc(e.instructions||"Read each question carefully. Your time starts when you tap Start. Answer every question, then tap Submit exam.")}</textarea>
 <button class="b" data-a="sched" data-id="${e.id}">${e.closes_at?"Update schedule":"Schedule and make codes"}</button></div>`
 +(e.closes_at?`<div class="card"><h2>Lab control</h2><p class="mut">Student codes only work while the exam is open.</p><button class="b${e.is_open?" o":""}" data-a="tgl" data-id="${e.id}" data-v="${e.is_open?0:1}">${e.is_open?"Close exam":"Open exam"}</button> <button class="b o" data-a="sheet" data-id="${e.id}">Print code sheet</button></div>
 <div class="card"><h2>Publish results</h2><p class="mut">${e.results_released?"Results are published. Students can see them on their profile.":"Results are not published. Students cannot see them yet."} Theory marks are suggestions until confirmed.${S.ai&&S.ai.unconfirmed>0?` <b>${S.ai.unconfirmed} AI marks still need your confirmation.</b>`:""}</p><button class="b${e.results_released?" o":""}" data-a="rel" data-id="${e.id}" data-v="${e.results_released?0:1}">${e.results_released?"Hide results":"Publish results to students"}</button></div>
 ${aiCard(e)}
 <div class="card"><h2>Roll call</h2><p class="mut">${cnt("Not started")} not started · ${cnt("In progress")} in progress · ${cnt("Submitted")} submitted</p><button class="b o sm" data-a="refresh">Refresh</button>
 ${xc.map(c=>{const s2=stt(c),a=at.find(y=>y.student_id===c.student_id);return `<div class="row" style="display:block"><b>${esc(c.students.name)}</b> <small>${esc(c.students.admission_no)}</small> <span class="tag ${s2==="Submitted"?"ok":""}">${s2}</span><br><span class="code">${esc(c.code)}</span> <button class="b o sm" data-a="reissue" data-e="${e.id}" data-s="${c.student_id}">New code</button>${s2==="In progress"?` <button class="b o sm" data-a="force" data-id="${a.id}">Force submit</button>`:""}</div>`}).join("")||'<p class="mut">No students are enrolled in this subject yet.</p>'}</div>`:"");
}
function pinSheet(){
 return `<div class="noprint"><button class="b o sm" data-a="pback">Back</button> <button class="b" data-a="prt">Print or save as PDF</button></div>
 <div class="card"><h2>${esc(S.school.name)}</h2><p>Student profile sign-in<br>School code: <b class="code">${esc(S.school.school_code)}</b></p><p class="mut noprint">PINs cannot be shown again after you leave this page.</p>
 <table><tr><th>Name</th><th>Class</th><th>Admission</th><th>PIN</th></tr>${S.pins.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.class||"")}</td><td>${esc(p.adm)}</td><td><b style="font-size:1.3rem;letter-spacing:.12em">${esc(p.pin)}</b></td></tr>`).join("")}</table>
 <p class="mut">Keep your PIN private.</p></div>`;
}
function sheetView(){
 const e=S.exams.find(x=>x.id===S.sheet),xc=(S.xc||[]).slice().sort((a,b)=>a.students.name.localeCompare(b.students.name));
 return `<div class="noprint"><button class="b o sm" data-a="sback">Back</button> <button class="b" data-a="prt">Print or save as PDF</button></div>
 <div class="card"><h2>${esc(S.school.name)}</h2><p><b>${esc(e.subject)} · ${esc(e.class_name)}</b><br>${fmt(e.starts_at)} to ${fmt(e.closes_at)} · ${e.duration_mins} minutes per student</p>
 <table><tr><th>Name</th><th>Admission</th><th>Exam code</th></tr>${xc.map(c=>`<tr><td>${esc(c.students.name)}</td><td>${esc(c.students.admission_no)}</td><td><b style="font-size:1.3rem;letter-spacing:.12em">${esc(c.code)}</b></td></tr>`).join("")}</table>
 <p class="mut">Keep your code private. Enter it only in the exam lab.</p></div>`;
}
function secAccount(){return `<div class="card"><h2>Account</h2><p class="mut">Signed in as ${esc(sess.email||"")}</p><input id="np" type="password" placeholder="New password (8 or more characters)" autocomplete="new-password"><input id="np2" type="password" placeholder="Repeat new password" autocomplete="new-password"><button class="b" data-a="chgPw">Change password</button></div>`}
function secInsights(){
 const s=S.school;
 if(S.rep)return repView(S.rep);
 const ex=S.exams.filter(e=>e.status==="approved"&&e.closes_at);
 const f=(id,l,v,mx)=>`<p class="mut">${l}</p><input id="${id}" type="number" min="0" max="${mx}" value="${v}">`;
 return `<div class="card"><h2>Criteria</h2><p class="mut">Only you, as administrator, can change these. Teachers and students cannot see or change them.</p>
 ${f("c1","A student fails a topic when they score below (% correct)",s.topic_fail_pct,99)}${f("c2","Pass standard when no more than this % of the class failed",s.pass_std_max_fail_pct,99)}${f("c3","Review when no more than this % failed (above it: Re-evaluate)",s.review_max_fail_pct,100)}${f("c4","Class index is Good at or above this average %",s.index_good_pct,100)}${f("c5","Class index is Fair at or above this average % (below it: Poor)",s.index_fair_pct,99)}
 <button class="b" data-a="saveCrit">Save criteria</button></div>
 <div class="card"><h2>Exam reports</h2>${ex.length?ex.map(e=>`<p class="row"><span>${esc(e.subject)} · ${esc(e.class_name)}</span><button class="b o sm" data-a="rpt" data-id="${e.id}">View report</button></p>`).join(""):`<p class="mut">Reports appear here for scheduled exams. Students must submit first.</p>`}</div>`;
}
function repView(r){
 const s=S.school,e=S.exams.find(x=>x.id===r.id)||{},t=S.teachers.find(x=>x.id===e.teacher_id);
 const avg=r.overall.avg_pct;
 const idx=avg==null?["No scores yet",""]:avg>=s.index_good_pct?["Good","ok"]:avg>=s.index_fair_pct?["Fair",""]:["Poor","bad"];
 const L=x=>{const f=100*x.failed/x.students;return x.students<5?["Not enough data",""]:f<=s.pass_std_max_fail_pct?["Pass standard","ok"]:f<=s.review_max_fail_pct?["Review",""]:["Re-evaluate","bad"]};
 const need=r.topics.filter(x=>{const l=L(x)[0];return l==="Review"||l==="Re-evaluate"});
 const msg=t&&need.length?`Hello ${t.name}, topic review for ${e.subject} (${e.class_name}). Please revise these topics in class: `+need.map(x=>x.topic+" ("+Math.round(100*x.failed/x.students)+"% failed)").join(", ")+".":"";
 const qs=r.questions.filter(q=>q.check_key||q.pct_correct<35).sort((a,b)=>a.pct_correct-b.pct_correct);
 return `<div class="card"><button class="b o sm" data-a="rback">Back</button> <b>${esc(e.subject)} · ${esc(e.class_name)}</b><p class="mut">${r.submitted} submitted · class average ${avg==null?"–":avg+"%"} · Class index <span class="tag ${idx[1]}">${idx[0]}</span></p>${r.submitted<5?`<p class="note bad">Fewer than 5 students have submitted, so topic labels are not shown yet.</p>`:""}</div>

 async aiRun(d){const p=$("#aip");let total=0,msg2="";
  for(let i=0;i<40;i++){
   await db("schools?select=id&limit=1");
   const r=await fetch(SB+"/functions/v1/ai-mark",{method:"POST",headers:{apikey:PK,Authorization:"Bearer "+sess.access_token,"Content-Type":"application/json"},body:JSON.stringify({exam_id:d.id})}).catch(()=>null);
   if(!r)throw new Error("No connection. Check your internet and try again.");
   const j=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(j.error||"The AI marking service gave an error.");
   total+=j.done||0;
   const q=$("#aip");if(q)q.textContent="Marked "+total+" student(s)… "+j.remaining+" left";
   if(!j.done&&j.errors&&j.errors.length)throw new Error(j.errors[0]);
   if(j.capped){msg2=" Daily AI limit reached. Try again tomorrow.";break}
   if(j.limited){msg2=" The AI service is busy. Wait a minute and tap Mark with AI again.";break}
   if(!j.remaining)break}
  note((total?"AI marked "+total+" student(s). Now review the marks.":"Nothing new to mark.")+msg2,!!msg2);await loadDetail()},

 bulkTemplate(){const bin=atob(TPL_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([u],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"})),a=document.createElement("a");a.href=url;a.download="SBT-Question-Template.docx";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)},

 async bulkFile(){const[f]=await pickFiles(false,".docx,.doc,.txt,.md,.csv");if(!f)return;let t="";

  else if(/\.csv$/i.test(f.name))t=csvToText(await f.text());
  else if(/\.(txt|md)$/i.test(f.name))t=await f.text();
  else if(/\.doc$/i.test(f.name))throw new Error("Old .doc files cannot be read. In Word choose Save As, then Word Document (.docx).");
  else throw new Error("Please use a .docx, .csv or .txt file, or paste the text.");
  bulkSet(t)},

  T.bulk.forEach(b=>{const ok=b.q&&b.o.length===4&&b.o.every(Boolean)&&b.ans!=null;
   if(ok&&!q2()){T.qs.push({kind:"mcq",body:b.q,options:b.o,correct_index:b.ans,key_terms:[],topic:b.topic||tp});added++}
   else{if(ok)full=true;rest.push({...b,ok:false,w:ok?["No room left: the limit is 60 questions"]:bWarn(b)})}});

 addM(){const q=val("#mq"),f=T.f,o=[0,1,2,3].map(i=>f.o[i]?{image:f.o[i],alt:val("#o"+i)||undefined}:val("#o"+i));if(o.some(x=>x===""))throw new Error("Fill in every option with text or an image.");if(!q&&!f.m)throw new Error("Add the question as text, an image, or both.");if(q2())throw new Error("The limit is 60 questions.");T.qs.push({kind:"mcq",body:q,image_id:f.m||undefined,options:o,correct_index:+val("#ok"),key_terms:[],topic:val("#mtp")});T.f={m:null,f:null,o:[null,null,null,null]};render()},
 addF(){const q=val("#fq"),acc=val("#fa").split(/[\n,]/).map(x=>x.trim()).filter(Boolean);if(!q&&!T.f.f)throw new Error("Type the question with a blank, like: A noun is a name of ____");if(!acc.length)throw new Error("Add at least one accepted answer.");if(q2())throw new Error("The limit is 60 questions.");T.qs.push({kind:"fill",body:q,image_id:T.f.f||undefined,accepted:acc,allow_typos:$("#ft").checked,ai_check:$("#fai").checked,topic:val("#ftp")});T.f={m:null,f:null,o:[null,null,null,null]};render()},

 addT2(){const q=val("#tq");if(!q)throw new Error("Enter the question.");if(q2())throw new Error("The limit is 60 questions.");const k=val("#tkw").split("\n").map(l=>l.split(/[=:]/)).filter(p=>p[0].trim()).map(p=>({term:p[0].trim(),marks:parseFloat(p[1])||1}));const mk=val("#tmk").split("\n").map(l=>{const i=l.lastIndexOf("=");return i<0?{text:l.trim(),marks:1}:{text:l.slice(0,i).trim(),marks:parseFloat(l.slice(i+1))||1}}).filter(p=>p.text);T.qs.push({kind:"theory",body:q,model_answer:val("#tm2"),key_terms:k,marking:mk,topic:val("#ttp")});render()},
