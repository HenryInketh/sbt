function syncBulk(){const B=T.bulk;if(!B)return;T.bt=val("#bt");B.forEach((b,i)=>{if(!$("#bq"+i))return;b.q=val("#bq"+i);b.o=[0,1,2,3].map(j=>val("#bo"+i+"_"+j));const k=val("#bk"+i);b.ans=k===""?null:+k;b.topic=val("#bp"+i)})}
function bulkSet(t){T.bulk=parseMcq(t,(T.qs||[]).map(x=>x.body));if(!T.bulk.length){T.bulk=null;throw new Error("I could not find any questions. Check the pattern shown above, or tap Show an example.")}render()}
function bulkView(){const B=T.bulk,room=Math.max(0,60-T.qs.length),ready=B.filter(b=>b.ok).length;
 return `<div class="card"><h2>Check the questions (${B.length} found)</h2><p class="mut">${ready} ready · ${B.length-ready} need attention · room for ${room} more (limit 60). Fix anything marked Needs attention, or remove it. Anything you leave out stays here.</p><input id="bt" list="tps" placeholder="Topic for all of these (optional)" value="${esc(T.bt||"")}">${B.map((b,i)=>`<div class="row" style="display:block"><b>${i+1}.</b> ${b.ok?`<span class="tag ok">Ready</span>`:`<span class="tag bad">Needs attention</span>`} <button class="b o sm" data-a="bulkRm" data-i="${i}" style="float:right">Remove</button>${(b.w||[]).length?`<p class="mut" style="margin:4px 0">${esc(b.w.join(" · "))}</p>`:""}<textarea id="bq${i}" rows="2">${esc(b.q)}</textarea>${[0,1,2,3].map(j=>`<input id="bo${i}_${j}" placeholder="Option ${"ABCD"[j]}" value="${esc(b.o[j]||"")}">`).join("")}<select id="bk${i}"><option value="">Correct answer?</option>${[0,1,2,3].map(j=>`<option value="${j}"${b.ans===j?" selected":""}>${"ABCD"[j]}</option>`).join("")}</select><input id="bp${i}" list="tps" placeholder="Topic (optional)" value="${esc(b.topic||"")}"></div>`).join("")}<button class="b" data-a="bulkAdd">Add the ready questions</button> <button class="b o" data-a="bulkCancel">Cancel</button></div>`}
const SECS=["Profile","Classes","Students","Teachers","Exams","Results","Insights","Account"];
const chk=(l,on,a,at)=>`<label class="chk"><input type="checkbox" ${on?"checked":""} data-a="${a}" ${at}> ${esc(l)}</label>`;
const nm=(arr,id)=>{const x=arr.find(y=>y.id===id);return x?x.name:"—"};
const tlink=t=>location.href.split("#")[0]+"#teacher-"+t.access_token;
const lst=v=>v.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);

function school(){
 if(rec)return `<div class="card"><h2>Set your password</h2><input id="rp1" type="password" placeholder="New password (8 or more characters)" autocomplete="new-password"><input id="rp2" type="password" placeholder="Repeat new password" autocomplete="new-password"><button class="b" data-a="recSet">Save new password</button></div>`;
 if(!sess)return `<div class="card"><h2>School sign in</h2><p class="mut">Schools are registered by SBT. Sign in with the email we registered for your school. First time? Open the invite link we emailed you to set your password.</p><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password"><button class="b" data-a="signin">Sign in</button><p><button class="b o sm" data-a="forgot">Forgot password?</button></p></div>`;
 if(!S)return `<p class="mut">Loading…</p>`;
 const so=`<p><button class="b o" data-a="out">Sign out</button></p>`;
 const own=S.adm?`<div class="card"><h2>Add a school</h2><input id="asn" placeholder="School name"><input id="ase" type="email" placeholder="School administrator's email" autocomplete="off"><input id="asp" inputmode="tel" placeholder="Phone (optional)"><button class="b" data-a="addSchool">Add school</button><p class="mut">The school gets its school code right away, and the administrator is emailed an invite to set a password.</p></div><div class="card"><h2>All schools (${S.all.length})</h2>${S.all.length?S.all.map(x=>`<div class="row" style="display:block"><b>${esc(x.name)}</b> <span class="tag ${x.approved?"ok":""}">${x.approved?"Active":"Suspended"}</span><p class="mut" style="margin:2px 0 6px">School code <b class="code">${esc(x.school_code)}</b> · ${esc(x.owner_email||"")} · ${x.owner_id?"Administrator signed in":"Waiting for administrator"}</p><button class="b${x.approved?" o":""}" data-a="ap" data-id="${x.id}" data-v="${x.approved?0:1}">${x.approved?"Suspend":"Reactivate"}</button>${x.owner_id?"":` <button class="b o" data-a="reinvite" data-id="${x.id}">Send invite again</button>`}</div>`).join(""):`<p class="mut">No schools yet.</p>`}</div>`:"";
 if(!S.school)return S.adm?own+so:`<div class="card"><h2>Not registered</h2><p>This email has not been registered with a school. Please contact SBT to have your school added.</p></div>`+so;
 if(!S.school.approved)return own+`<div class="card"><h2>${esc(S.school.name)}</h2><p>Your school's access is switched off. Please contact SBT.</p></div>`+so;
 if(S.pins)return pinSheet();
 if(S.sheet)return sheetView();
 const secs=SECS.concat(S.adm?["Schools"]:[]);
 const body={Profile:secProfile,Classes:secClasses,Students:secStudents,Teachers:secTeachers,Exams:secExams,Results:secResults,Insights:secInsights,Account:secAccount,Schools:()=>own}[sec]();
 return `<p class="row"><b>${esc(S.school.name)}</b><button class="b o sm" data-a="out">Sign out</button></p><div class="chips">${secs.map(x=>`<button class="${sec===x?"on":""}" data-a="sec" data-v="${x}">${x}</button>`).join("")}</div>`+body;
}
function secProfile(){const p=S.school;return `<div class="card"><h2>School code</h2><p class="mut">Students use this code, their admission number and a PIN to open their profile.</p><p><span class="code">${esc(p.school_code)}</span></p></div><div class="card"><h2>School profile</h2><input id="pn" placeholder="School name" value="${esc(p.name)}"><input id="pa" placeholder="Address" value="${esc(p.address)}"><input id="pp" placeholder="Phone" inputmode="tel" value="${esc(p.phone)}"><div class="g2"><input id="ps" placeholder="Session, e.g. 2026/2027" value="${esc(p.current_session)}"><input id="pt" placeholder="Term, e.g. First Term" value="${esc(p.current_term)}"></div><button class="b" data-a="saveP">Save profile</button></div>`}

 <div class="card"><h2>Questions to check</h2>${qs.length?qs.map(q=>`<p class="row"><span>${q.position}. ${esc(q.body)}${q.topic?` <small>· ${esc(q.topic)}</small>`:""}${q.check_key?`<br><small class="mut">Most chose ${q.top_wrong} (${q.top_wrong_share}%). Check the answer key.</small>`:""}</span><b>${q.pct_correct}%</b></p>`).join(""):`<p class="mut">No questions flagged.</p>`}</div>
 <div class="card"><h2>Students</h2><div class="sc"><table><tr><th>#</th><th>Name</th><th>Score</th><th>%</th></tr>${r.students.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}<br><small>${esc(x.adm)}</small></td><td>${x.score}/${x.max}</td><td>${x.pct}%</td></tr>`).join("")}</table></div></div>`;

function teacher(){
 if(T===false)return "";
 if(!T)return `<p class="mut">Loading…</p>`;
 if(T.ex){const e=T.ex,qs=T.qs,al=e.allow||{images:true,fill:true,theory:true};
  if(e.status!=="awaiting")return `<div class="card"><h2>${esc(e.subject)} · ${esc(e.class_name)}</h2><p>This paper is with the school. You can edit it again only if the school sends it back.</p><button class="b o" data-a="back">Back</button></div>`;
  return `<div class="card"><button class="b o sm" data-a="back">Back</button> <b>${esc(e.subject)} · ${esc(e.class_name)}</b><p class="mut">${qs.length} of 60 questions added${e.kind==="practice"?" · Practice set: objective questions only":""} <span id="upl"></span></p></div>
 ${T.bulk?bulkView():`<div class="card"><h2>Add many questions at once</h2><p class="mut">Paste your questions, or upload a Word (.docx), .csv or text file. Not sure how to set them out? Download the Word template, type your questions into it, then upload it here.</p><p class="mut" style="margin:6px 0">What I can read:<br>• Options on separate lines, or all on one line<br>• Word's automatic numbering and lettering, and tables<br>• The answer as Answer: B, a bold or starred (*) option, or a list at the end (1. B 2. C)<br>• Lines like Topic: Fractions to tag questions<br>• Subscripts and superscripts, like H₂O and x²</p><textarea id="bulk" rows="6" placeholder="Paste questions here"></textarea><button class="b" data-a="bulkRead">Read questions</button> <button class="b o" data-a="bulkFile">Upload Word, CSV or text file</button> <button class="b o sm" data-a="bulkSample">Show an example</button> <button class="b o sm" data-a="bulkTemplate">Download Word template</button><p class="mut" style="margin:6px 0 0"><small>Pictures and equations inside a document are not carried over. Add those questions one at a time below.</small></p></div>`}
 ${e.kind!=="practice"&&al.theory?`<div class="card"><h2>Lesson note (optional)</h2><p class="mut" style="margin-top:0">Paste or upload the lesson note you taught from. For theory questions, the system can draft the model answer and marking scheme from it. You always check and correct the draft. For a PDF, copy the text and paste it here.</p><textarea id="ln" rows="6" placeholder="Paste your lesson note here">${esc(e.note||"")}</textarea><button class="b" data-a="saveNote">Save lesson note</button> <button class="b o" data-a="noteFile">Upload Word or text file</button><p class="mut" id="lnm" style="margin:8px 0 0">${e.note?e.note.length.toLocaleString()+" characters saved.":"No lesson note saved yet."}</p></div>`:""}
 <div class="card"><h2>Objective question (A to D)</h2><textarea id="mq" rows="2" placeholder="Question${al.images?" (or add an image below)":""}"></textarea>${al.images?`<button class="b o sm" data-a="pickQ" data-w="m">Add question image</button><div id="qpv"></div>`:""}<input id="mtp" list="tps" placeholder="Topic, e.g. Fractions"><datalist id="tps">${(T.topics||[]).map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
 <div class="g2">${[0,1,2,3].map(i=>`<div><input id="o${i}" placeholder="Option ${"ABCD"[i]}">${al.images?`<button class="b o sm" data-a="pickO" data-i="${i}">Image</button><div id="opv${i}"></div>`:""}</div>`).join("")}</div>${al.images?`<p><button class="b o sm" data-a="pickO4">Add 4 photos as options A to D</button></p>`:""}
 <select id="ok"><option value="0">Correct answer: A</option><option value="1">Correct answer: B</option><option value="2">Correct answer: C</option><option value="3">Correct answer: D</option></select><button class="b" data-a="addM">Add question</button></div>
 ${e.kind!=="practice"&&al.fill?`<div class="card"><h2>Fill in the gap</h2><textarea id="fq" rows="2" placeholder="Question, e.g. A noun is a name of ____"></textarea>${al.images?`<button class="b o sm" data-a="pickQ" data-w="f">Add question image</button><div id="fpv"></div>`:""}<textarea id="fa" rows="3" placeholder="Accepted answers, one per line&#10;animal&#10;person"></textarea><label class="chk"><input type="checkbox" id="ft" checked> Forgive small spelling mistakes</label><label class="chk"><input type="checkbox" id="fai"> Let AI accept related answers I did not list (the school reviews them)</label><input id="ftp" list="tps" placeholder="Topic"><button class="b" data-a="addF">Add question</button></div>`:""}
 ${e.kind!=="practice"&&al.theory?`<div class="card"><h2>Theory question</h2><textarea id="tq" rows="2" placeholder="Question"></textarea><p class="mut" style="margin:6px 0 0">Total marks for this question</p><div class="g2"><input id="ttm" type="number" min="1" max="20" value="5"><button class="b o" data-a="aiScheme">Draft from lesson note</button></div><p class="mut" id="aim" style="margin:0 0 8px">Type the question, then draft the model answer and marking scheme from your lesson note. Correct the draft before you add the question.</p><input id="ttp" list="tps" placeholder="Topic, e.g. Photosynthesis"><textarea id="tm2" rows="2" placeholder="Model answer"></textarea><textarea id="tmk" rows="4" placeholder="Marking scheme for AI marking: one point per line = marks&#10;Uses sunlight = 2&#10;Makes glucose = 3"></textarea><textarea id="tkw" rows="2" placeholder="Key terms (backup if AI is off): one per line = marks&#10;photosynthesis = 2"></textarea><button class="b" data-a="addT2">Add question</button></div>`:""}
 <div class="card"><h2>Your questions</h2>${qs.length?qs.map((q,i)=>`<p class="row"><span>${i+1}. ${q.kind==="mcq"?"Objective":q.kind==="fill"?"Fill":"Theory"}${q.image_id||(q.options||[]).some(o=>o&&o.image)?" 🖼":""}: ${esc(q.body?q.body.slice(0,60):"(image question)")}${q.topic?` <small>· ${esc(q.topic)}</small>`:""}</span><button class="b o sm" data-a="del" data-i="${i}">Remove</button></p>`).join(""):`<p class="mut">Nothing added yet.</p>`}
 <p><button class="b o" data-a="draft">Save draft</button> <button class="b" data-a="sub"${qs.length?"":" disabled"}>Submit to school</button></p></div>`;}
 const h=T.home;
 return `<div class="card"><h2>Hello, ${esc(h.name)}</h2><p class="mut">${h.assignments.map(a=>esc(a.subject+" · "+a.class)).join(" | ")||"No subjects assigned yet."}</p></div><div class="card"><h2>Your papers <button class="b o sm" data-a="trefresh" style="float:right">Refresh</button></h2>${h.exams.length?h.exams.map(e=>`<div class="row"><span><b>${esc(e.subject)} · ${esc(e.class_name)}</b><br><small>${e.questions} questions${e.kind==="practice"?" · Practice":""}</small></span><span><span class="tag ${e.status==="awaiting"?"":"ok"}">${e.status==="awaiting"?"Draft":e.status==="submitted"?"With school":"Approved"}</span> <button class="b o sm" data-a="openX" data-id="${e.id}">${e.status==="awaiting"?"Edit":"View"}</button></span></div>`).join(""):`<p class="mut">No papers yet. The school will create one for you.</p>`}</div>`;
}

let px=null;
const bump=()=>{clearTimeout(window._dt);window._dt=setTimeout(()=>{if(/dash|prun|pdone/.test(st.step)){st={step:"login"};px=null;render()}},6e5)};
function mergeT(a,b){const m=new Map();[...a,...b].forEach(t=>{const k=t.subject+"|"+t.topic,x=m.get(k)||{subject:t.subject,topic:t.topic,correct:0,total:0};x.correct+=t.correct;x.total+=t.total;m.set(k,x)});return[...m.values()]}
function prun(){const q=px.qs[px.i],n=px.qs.length;
 return `<div class="tmbar"><span>Practice · ${esc(px.subject)}</span><span>${px.i+1}/${n}</span></div><div class="card">${q.topic?`<p class="mut">${esc(q.topic)}</p>`:""}<p class="q">${esc(q.body)}</p>${qImg(q)}${q.options.map((o,j)=>optHtml(o,j,px.ans[px.i]===j,"ppick")).join("")}<div class="nav2"><button class="b o" data-a="pprev"${px.i?"":" disabled"}>Previous</button>${px.i<n-1?`<button class="b" data-a="pnext">Next</button>`:`<button class="b" data-a="pfin">Finish</button>`}</div></div><p><button class="b o sm" data-a="pquit">Stop practice</button></p>`;
}
function pdone(){const r=px.res,pct=r.max?Math.round(100*r.score/r.max):0;
 return `<div class="card"><h2>Practice result</h2><p class="q"><b>${r.score} / ${r.max}</b> · ${pct}%</p><button class="b" data-a="pback">Back to my profile</button></div><div class="card"><h2>Review</h2>${r.items.map(it=>`<div class="row" style="display:block"><b>${it.n}.</b> ${esc(it.body)}${qImg(it)}${it.topic?` <small class="mut">· ${esc(it.topic)}</small>`:""}<br>${it.options.map((o,j)=>`<small style="color:${j===it.correct?"var(--ok)":j===it.chosen?"var(--err)":"var(--mut)"}">${"ABCD"[j]}. ${o&&typeof o==="object"&&o.image?`<img src="${IMG[o.image]||""}" alt="" style="max-height:50px;vertical-align:middle;background:#fff">`:esc(o)}${j===it.correct?" ✓":j===it.chosen?" ✗ your answer":""}</small>`).join("<br>")}</div>`).join("")}</div>`;
}
function jambCard(){
 const j=st.jb;if(!j||!j.ok||!j.enabled)return "";
 const ch=j.chosen||[];
 if(st.jedit||!ch.length){const sel=st.jsel||(st.jsel=[]);
  return `<div class="card"><h2>JAMB practice</h2><p class="mut">Choose your JAMB subjects (up to 4).</p>${j.available.map(x=>chk(x.name,sel.includes(x.id),"jtog",`data-id="${x.id}"`)).join("")||'<p class="mut">No subjects yet.</p>'}<button class="b" data-a="jsave">Save subjects</button>${ch.length?` <button class="b o" data-a="jcancel">Cancel</button>`:""}</div>`}
 const d=ch.filter(x=>x.pct!=null),mean=d.length?d.reduce((a,x)=>a+Number(x.pct),0)/d.length:null;
 const best=d.length>1?d.reduce((a,x)=>Number(x.pct)>Number(a.pct)?x:a):null,low=d.length>1?d.reduce((a,x)=>Number(x.pct)<Number(a.pct)?x:a):null;
 return `<div class="card"><h2>JAMB practice</h2>${mean==null?`<p class="mut">Do a practice in any of your subjects to see your estimate.</p>`:`<p class="q"><b>${Math.round(mean*4)} / 400</b> <small class="mut">· ${Math.round(mean)}% overall${d.length<ch.length?` · based on ${d.length} of ${ch.length} subjects`:""}</small></p>`}${ch.map(x=>`<div class="row"><span>${esc(x.name)}</span><span>${x.pct==null?"No practice yet":`<b>${x.pct}%</b> <small class="mut">≈ ${x.pct} / 100</small>`}</span></div>`).join("")}${best?`<p class="mut">Strongest: <b>${esc(best.name)}</b> · Weakest: <b>${esc(low.name)}</b></p>`:""}<small>Estimate from your last 3 practice results in each subject. It is not an official JAMB score.</small><p><button class="b o sm" data-a="jedit">Change subjects</button></p></div>`;
}
function dash(d){
 const lab={done:["Done","ok"],in_progress:["In progress",""],open:["Open now","ok"],upcoming:["Upcoming",""],scheduled:["Scheduled",""],missed:["Missed",""],none:["Not scheduled yet",""]};
 const subj=d.subjects.map(s=>{const l=lab[s.state];let x="";
  if(s.state==="upcoming")x=(s.days<=0?"Today":s.days===1?"Tomorrow":"In "+s.days+" days")+" · "+fmt(s.starts_at);
  else if(s.state==="done")x=s.score!=null?"Score "+s.score+" / "+s.max:"Result not released yet";
  else if(s.state==="open")x="Go to the exam lab and enter your code";
  else if(s.state==="scheduled")x=fmt(s.starts_at);
  else if(s.state==="missed")x="Ask your school about a make-up";
  return `<div class="row" style="display:block"><b>${esc(s.subject)}</b> <span class="tag ${l[1]}">${l[0]}</span><p class="mut" style="margin:4px 0 0">${esc(x)}</p></div>`}).join("")||`<p class="mut">No subjects yet. Ask your school.</p>`;
 const recs=d.records.length?`<div class="sc"><table><tr><th>Subject</th><th>Date</th><th>Score</th></tr>${d.records.map(r=>`<tr><td>${esc(r.subject)}</td><td>${fmt(r.date)}</td><td>${r.released?`<b>${r.score}/${r.max}</b>`:"Not released"}</td></tr>`).join("")}</table></div><small>Theory marks may change after your teacher confirms them.</small>`:`<p class="mut">No exams taken yet.</p>`;
 const pr=st.pr&&st.pr.ok?st.pr:{sets:[],topics:[]};
 const pset=pr.sets.length?pr.sets.map(x=>`<div class="row" style="display:block"><b>${esc(x.subject)}</b> <small class="mut">${x.questions} questions${x.attempts?` · tried ${x.attempts}×${x.best!=null?` · best ${x.best}%`:""}`:""}</small><br><button class="b sm" data-a="pstart" data-id="${x.id}">${x.attempts?"Practise again":"Start practice"}</button></div>`).join(""):`<p class="mut">No practice sets yet. Your teacher will add them.</p>`;
 const tp=mergeT(d.topics,pr.topics).map(t=>{const p=Math.round(100*t.correct/t.total);return{...t,p,k:t.total<5?"b":p<50?"w":p>=70?"s":"b"}});
 const grp=(k,title)=>{const a=tp.filter(t=>t.k===k);return a.length?`<p><b>${title}</b></p>`+a.map(t=>`<div style="margin:8px 0"><span>${esc(t.topic)} <small class="mut">${esc(t.subject)} · ${t.correct}/${t.total}</small></span><div style="height:8px;border-radius:4px;background:var(--line)"><div style="height:8px;border-radius:4px;width:${t.p}%;background:${k==="w"?"var(--amb)":"var(--ok)"}"></div></div></div>`).join(""):""};
 const tops=tp.length?grp("w","Needs more work")+grp("s","Strong")+grp("b","Still building (needs 5 or more questions)"):`<p class="mut">Topic results appear after you practise or your school releases exam results.</p>`;
 return `<div class="card"><h2>${esc(d.student.name)}</h2><p class="mut">${esc(d.student.class||"")} · ${esc(d.school)} · ${esc(d.student.adm)}</p></div><div class="card"><h2>Practice</h2>${pset}</div>${jambCard()}<div class="card"><h2>My subjects</h2>${subj}</div><div class="card"><h2>My exam records</h2>${recs}</div><div class="card"><h2>Strengths and weaknesses</h2>${tops}</div><p><button class="b o" data-a="again">Sign out</button></p>`;
}
function student(){
 if(st.step==="login"){const pm=st.mode==="profile";return `<div class="chips"><button class="${pm?"":"on"}" data-a="smode" data-v="code">Exam code</button><button class="${pm?"on":""}" data-a="smode" data-v="profile">My profile</button></div>`+(pm?`<div class="card"><h2>My profile</h2><input id="pc" placeholder="School code" autocapitalize="characters" autocomplete="off"><input id="pa2" placeholder="Admission number" autocomplete="off"><input id="pp2" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"><button class="b" data-a="plogin">Open my profile</button></div>`:`<div class="card"><h2>Enter your codes</h2><input id="ssc" placeholder="School code" autocomplete="off" autocapitalize="characters" autocorrect="off" value="${esc(st.school||"")}"><input id="sc" inputmode="numeric" placeholder="Exam code" autocomplete="off" autocapitalize="off" autocorrect="off"><button class="b" data-a="login">Continue</button></div>`)}
 if(st.step==="dash")return dash(st.d);
 if(st.step==="prun")return prun();
 if(st.step==="pdone")return pdone();
 if(st.step==="pload")return `<div class="card"><p id="pl" class="mut">Loading practice…</p></div>`;
 if(st.step==="lobby"){const r=st.r;
 return `<div class="card"><h2>${esc(r.student_name)}</h2><p>${esc(r.class_name)} · <b>${esc(r.subject)}</b></p><p class="mut">${r.question_count} questions · ${r.duration_mins} minutes</p>${r.instructions?`<p style="white-space:pre-wrap">${esc(r.instructions)}</p>`:""}${r.message?`<p class="note bad">${esc(r.message)}</p>`:""}<p class="mut" id="pl">${r.can_start&&!st.ready?"Loading pictures…":""}</p><button class="b" data-a="go"${r.can_start&&st.ready?"":" disabled"}>${r.resume?"Continue exam":"Start exam"}</button> ${r.can_start?"":`<button class="b o" data-a="login">Check again</button> `}<button class="b o" data-a="again">Not me</button></div>`}
 if(st.step==="run"){const r=ex.r,qs=r.questions,i=ex.i,n=qs.length,q=qs[i],dn=qs.filter((_,k)=>ansOk(ex.ans[k])).length;
 return `<div class="tmbar"><span>${esc(r.subject)}</span><span class="tmr">${r.calc?`<button class="cb" data-a="calc">Calculator</button>`:""}<span id="tm"></span></span></div>${ex.warn?`<p class="note bad">${esc(ex.warn)}</p>`:""}<div class="card ns"><p class="mut">Question ${i+1} of ${n} · ${dn} answered</p><p class="q">${esc(q.body)}</p>${qImg(q)}
 ${q.kind==="mcq"?q.options.map((o,j)=>optHtml(o,j,ex.ans[i]===j,"pick")).join(""):q.kind==="fill"?`<input id="fi" placeholder="Type your answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(ex.ans[i]||"")}">`:`<textarea id="th" rows="7" placeholder="Write your answer">${esc(ex.ans[i]||"")}</textarea>`}
 <div class="nav2"><button class="b o" data-a="prev"${i?"":" disabled"}>Previous</button>${i<n-1?`<button class="b" data-a="next">Next</button>`:`<button class="b" data-a="fin">Submit exam</button>`}</div>
 <div class="qtools"><button class="b o sm" data-a="flag">${ex.flags[i]?"Remove flag":"Flag for review"}</button><button class="b o sm" data-a="qnav">${ex.nav?"Hide":"Show"} all questions</button></div>
 ${ex.nav?`<div class="qgrid">${qs.map((_,k)=>`<button class="qb${k===i?" cur":""}${ansOk(ex.ans[k])?" done":""}${ex.flags[k]?" flg":""}" data-a="goq" data-i="${k}" aria-label="Question ${k+1}">${k+1}</button>`).join("")}</div><div class="qleg"><span><i class="d"></i>Answered</span><span><i></i>Not answered</span><span><i class="f"></i>Flagged</span></div>`:""}</div>${ex.calc?calcHtml():""}`}

function calcEval(src,deg,ans){const s=src.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/π/g,"pi").replace(/√/g,"sqrt").replace(/\s+/g,"").toLowerCase();let p=0;
 const R=x=>deg?x*Math.PI/180:x,D=x=>deg?x*180/Math.PI:x;
 const F={sin:x=>Math.sin(R(x)),cos:x=>Math.cos(R(x)),tan:x=>Math.tan(R(x)),asin:x=>D(Math.asin(x)),acos:x=>D(Math.acos(x)),atan:x=>D(Math.atan(x)),log:Math.log10,ln:Math.log,sqrt:Math.sqrt,cbrt:Math.cbrt,exp:Math.exp,abs:Math.abs};
 const fact=n=>{if(n<0||n!==Math.floor(n)||n>170)throw 0;let r=1;for(let i=2;i<=n;i++)r*=i;return r};
 const pk=()=>s[p],more=()=>p<s.length;
 function expr(){let v=term();while(pk()==="+"||pk()==="-"){const o=s[p++],r=term();v=o==="+"?v+r:v-r}return v}
 function term(){let v=un();for(;;){if(pk()==="*"){p++;v*=un()}else if(pk()==="/"){p++;v/=un()}else if(more()&&(pk()==="("||/[a-z]/.test(pk()))){v*=un()}else break}return v}
 function pow(){const b=post();if(pk()==="^"){p++;return Math.pow(b,un())}return b}
 function un(){if(pk()==="-"){p++;return -un()}if(pk()==="+"){p++;return un()}return pow()}
 function post(){let v=prim();while(pk()==="!"||pk()==="%"){v=s[p++]==="!"?fact(v):v/100}return v}
 function prim(){if(pk()==="("){p++;const v=expr();if(pk()!==")")throw 0;p++;return v}
  const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(p));if(m){p+=m[0].length;return parseFloat(m[0])}

 async forgot(){const e=val("#em");if(!e)throw new Error("Type your email first, then tap Forgot password.");await raw("/auth/v1/recover?redirect_to="+encodeURIComponent(location.origin+location.pathname),{method:"POST",body:{email:e}});note("If that email has an account, a reset link has been sent. Check your inbox and spam folder.");render()},
 async recSet(){const a=$("#rp1").value,b=$("#rp2").value;if(a.length<8)throw new Error("Use at least 8 characters.");if(a!==b)throw new Error("The two passwords do not match.");await raw("/auth/v1/user",{method:"PUT",jwt:rec.token,body:{password:a}});rec=null;history.replaceState(null,"",location.pathname+location.search);note("Password changed. Sign in with your new password.");render()},
 async aiRun(d){const p=$("#aip");let total=0,msg2="";
  for(let i=0;i<40;i++){
   await db("schools?select=id&limit=1");
   const r=await fetch(SB+"/functions/v1/ai-mark",{method:"POST",headers:{apikey:PK,Authorization:"Bearer "+sess.access_token,"Content-Type":"application/json"},body:JSON.stringify({exam_id:d.id})}).catch(()=>null);
   if(!r)throw new Error("No connection. Check your internet and try again.");
   const j=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(j.error||"The AI marking service gave an error.");
   total+=j.done||0;
   const q=$("#aip");if(q)q.textContent="Marked "+total+" student(s)… "+j.remaining+" left";
   if(!j.done&&j.errors&&j.errors.length)throw new Error(j.errors[0]);
   if(j.capped){msg2=" Daily AI limit reached. Try again tomorrow.";break}
   if(j.limited){msg2=" The AI service is busy. Wait a minute and tap Mark with AI again.";break}
   if(!j.remaining)break}
  note((total?"AI marked "+total+" student(s). Now review the marks.":"Nothing new to mark.")+msg2,!!msg2);await loadDetail()},
 async aiReview(d){const L=await db(`ai_marks?exam_id=eq.${d.id}&status=eq.suggested&select=*,attempts(students(name,admission_no)),questions(position,body)&limit=300`);const o={low:0,medium:1,high:2};S.am=L.filter(m=>m.reason!=="No answer given.").sort((a,b)=>o[a.confidence]-o[b.confidence]);render()},
 async aiBack(){S.am=null;await loadDetail()},
 async aiConfirm(d){const v=parseFloat($("#am-"+d.id).value);if(isNaN(v))throw new Error("Type the marks.");await rpc2("confirm_mark",{p_mark:d.id,p_marks:v});S.am=S.am.filter(x=>x.id!==d.id);S.ai=await rpc2("ai_status",{p_exam:xd}).catch(()=>S.ai);render()},
 async aiHigh(d){const n=await rpc2("confirm_high",{p_exam:d.id});note(n+" clear marks confirmed.");await loadDetail()},
 bulkRead(){const t=val("#bulk");if(!t)throw new Error("Paste your questions first.");bulkSet(t)},
 bulkTemplate(){const bin=atob(TPL_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([u],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"})),a=document.createElement("a");a.href=url;a.download="SBT-Question-Template.docx";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)},
 bulkSample(){const e=$("#bulk");if(e)e.value=SAMPLE},
 async bulkFile(){const[f]=await pickFiles(false,".docx,.doc,.txt,.md,.csv");if(!f)return;let t="";
  if(/\.docx$/i.test(f.name)){await loadMammoth();let r;try{r=await window.mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()})}catch(e){throw new Error("I could not open that Word file. Copy the text from it and paste it instead.")}t=htmlToText(r.value)}
  else if(/\.csv$/i.test(f.name))t=csvToText(await f.text());
  else if(/\.(txt|md)$/i.test(f.name))t=await f.text();
  else if(/\.doc$/i.test(f.name))throw new Error("Old .doc files cannot be read. In Word choose Save As, then Word Document (.docx).");
  else throw new Error("Please use a .docx, .csv or .txt file, or paste the text.");
  bulkSet(t)},
 bulkRm(d){syncBulk();T.bulk.splice(+d.i,1);if(!T.bulk.length)T.bulk=null;render()},
 bulkCancel(){T.bulk=null;render()},
 bulkAdd(){syncBulk();const tp=T.bt||"",rest=[];let added=0,full=false;
  T.bulk.forEach(b=>{const ok=b.q&&b.o.length===4&&b.o.every(Boolean)&&b.ans!=null;
   if(ok&&!q2()){T.qs.push({kind:"mcq",body:b.q,options:b.o,correct_index:b.ans,key_terms:[],topic:b.topic||tp});added++}
   else{if(ok)full=true;rest.push({...b,ok:false,w:ok?["No room left: the limit is 60 questions"]:bWarn(b)})}});
  T.bulk=rest.length?rest:null;
  note(added+" question(s) added."+(rest.length?" "+rest.length+" still need fixing."+(full?" The limit is 60 questions.":""):" Remember to tap Save draft or Submit."),!!rest.length);render()},
 async openX(d){const r=await rpc("teacher_get_exam",{p_token:tk,p_exam:d.id});T.ex={id:d.id,subject:r.subject,class_name:r.class_name,status:r.status,kind:r.kind,allow:r.allow,note:r.lesson_note||""};T.f={m:null,f:null,o:[null,null,null,null]};T.bulk=null;T.qs=r.questions;T.topics=r.topics;render()},
 async back(){await loadT()},
 addM(){const q=val("#mq"),f=T.f,o=[0,1,2,3].map(i=>f.o[i]?{image:f.o[i],alt:val("#o"+i)||undefined}:val("#o"+i));if(o.some(x=>x===""))throw new Error("Fill in every option with text or an image.");if(!q&&!f.m)throw new Error("Add the question as text, an image, or both.");if(q2())throw new Error("The limit is 60 questions.");T.qs.push({kind:"mcq",body:q,image_id:f.m||undefined,options:o,correct_index:+val("#ok"),key_terms:[],topic:val("#mtp")});T.f={m:null,f:null,o:[null,null,null,null]};render()},
 addF(){const q=val("#fq"),acc=val("#fa").split(/[\n,]/).map(x=>x.trim()).filter(Boolean);if(!q&&!T.f.f)throw new Error("Type the question with a blank, like: A noun is a name of ____");if(!acc.length)throw new Error("Add at least one accepted answer.");if(q2())throw new Error("The limit is 60 questions.");T.qs.push({kind:"fill",body:q,image_id:T.f.f||undefined,accepted:acc,allow_typos:$("#ft").checked,ai_check:$("#fai").checked,topic:val("#ftp")});T.f={m:null,f:null,o:[null,null,null,null]};render()},
 async pickQ(d){const[f]=await pickFiles(false);if(!f)return;const id=await upImg(f,true);if(id){T.f[d.w]=id;setPv()}},
 async pickO(d){const[f]=await pickFiles(false);if(!f)return;const id=await upImg(f,true);if(id){T.f.o[+d.i]=id;setPv()}},
 async pickO4(){const fs=await pickFiles(true);if(!fs.length)return;if(fs.length>4)throw new Error("Choose up to 4 photos.");for(let j=0;j<fs.length;j++){const id=await upImg(fs[j],false);if(id)T.f.o[j]=id}setPv()},
 rmQ(d){T.f[d.w]=null;setPv()},
 rmO(d){T.f.o[+d.i]=null;setPv()},
 zoom(d){showZoom(IMG[d.img])},
 async togT(d){const x=S.subjects.find(y=>y.id===d.s);await db("subjects?id=eq."+d.s,{method:"PATCH",body:{[d.f]:!x[d.f]}});S.subjects=await db("subjects?select=*&order=name");render()},
 async noteFile(){const[f]=await pickFiles(false,".docx,.txt,.md");if(!f)return;const m=$("#lnm");let t="";
  try{if(/\.docx$/i.test(f.name)){await loadMammoth();const r=await window.mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});t=r.value}else if(/\.(txt|md)$/i.test(f.name))t=await f.text();else{if(m)m.textContent="Please use a .docx or .txt file, or paste the text.";return}}catch(e){if(m)m.textContent="I could not read that file. Copy the text and paste it instead.";return}
  t=t.replace(/\r/g,"").replace(/\n{3,}/g,"\n\n").trim();if(!t){if(m)m.textContent="I could not find any text in that file.";return}
  $("#ln").value=t.slice(0,40000);if(m)m.textContent=(t.length>40000?"Only the first 40,000 characters were kept. ":"")+"Tap Save lesson note to keep it."},
 async saveNote(){const t=val("#ln").slice(0,40000),m=$("#lnm");try{await rpc("teacher_save_note",{p_token:tk,p_exam:T.ex.id,p_note:t});T.ex.note=t;if(m){m.style.color="";m.textContent=t?t.length.toLocaleString()+" characters saved.":"Lesson note removed."}}catch(e){if(m){m.style.color="var(--err)";m.textContent=e.message}}},
 async aiScheme(){const out=$("#aim"),say=(x,bad)=>{if(out){out.textContent=x;out.style.color=bad?"var(--err)":""}};const q=val("#tq");
  if(!q)return say("Type the question first.",1);if(!T.ex.note)return say("Save a lesson note first. Paste it above, then tap Save lesson note.",1);
  const total=Math.max(1,Math.min(20,parseInt(val("#ttm"),10)||5));say("Drafting from your lesson note, please wait…");
  try{const r=await fetch(SB+"/functions/v1/ai-scheme",{method:"POST",headers:{apikey:PK,Authorization:"Bearer "+PK,"Content-Type":"application/json"},body:JSON.stringify({token:tk,exam_id:T.ex.id,questions:[{ref:"1",body:q,total}]})});
   const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"The drafting service is not available. Try again, or write the scheme yourself.");
   const it=(j.items||[])[0];if(!it||!it.covered||!(it.points||[]).length)return say("Your lesson note does not seem to cover this question, so nothing was drafted. Write the scheme yourself, or add the missing material to your note and save it.",1);
   $("#tm2").value=it.model_answer||"";$("#tmk").value=it.points.map(p=>p.text+" = "+p.marks).join("\n");say("Draft ready. Please read it and correct anything before you add the question.")}
  catch(e){say(e.message,1)}},
 async aiTest(){const o=$("#aitest"),say=(x,c)=>{if(o){o.textContent=x;o.style.color=c||""}};say("Testing, please wait…");try{const r=await fn("ai-scheme",{ping:true});say(r.ok?"Working. Provider: "+r.provider+", model: "+r.model+".":"Not working. "+(r.error||"No details."),r.ok?"var(--ok)":"var(--err)")}catch(e){say(e.message,"var(--err)")}},
  addT2(){const q=val("#tq");if(!q)throw new Error("Enter the question.");if(q2())throw new Error("The limit is 60 questions.");const k=val("#tkw").split("\n").map(l=>l.split(/[=:]/)).filter(p=>p[0].trim()).map(p=>({term:p[0].trim(),marks:parseFloat(p[1])||1}));const mk=val("#tmk").split("\n").map(l=>{const i=l.lastIndexOf("=");return i<0?{text:l.trim(),marks:1}:{text:l.slice(0,i).trim(),marks:parseFloat(l.slice(i+1))||1}}).filter(p=>p.text);T.qs.push({kind:"theory",body:q,model_answer:val("#tm2"),key_terms:k,marking:mk,topic:val("#ttp")});render()},
 del(d){T.qs.splice(+d.i,1);render()},
 async draft(){await rpc("teacher_save_questions",{p_token:tk,p_exam:T.ex.id,p_questions:T.qs});note("Draft saved. Come back to your link any time to continue.");render()},
 async sub(){await rpc("teacher_save_questions",{p_token:tk,p_exam:T.ex.id,p_questions:T.qs});await rpc("teacher_submit",{p_token:tk,p_exam:T.ex.id});T.ex.status="submitted";note("Submitted to the school.");render()},
 async login(){const c=(val("#sc")||st.code||"").replace(/\s/g,"");const sch=(val("#ssc")||st.school||"").replace(/\s/g,"").toUpperCase();if(!sch)throw new Error("Enter your school code.");if(!c)throw new Error("Enter your exam code.");const r=await rpc("student_enter",{p_code:c,p_school_code:sch});if(!r.ok)throw new Error(r.message);const ids=r.image_ids||[];st={step:"lobby",code:c,school:sch,r,ready:!ids.length};render();if(ids.length){const miss=await preload(ids,id=>rpc("exam_image",{p_code:c,p_image:id}));if(miss)throw new Error("Some pictures did not load. Tap Check again.");st.ready=true;render()}},
 async go(){const r=await rpc("student_begin",{p_code:st.code,p_school_code:st.school});let ans=r.answers||{};try{const l=JSON.parse(localStorage.getItem("cbt-ans-"+r.attempt_id));if(l)ans=l}catch(e){}const off=Date.parse(r.server_now)-Date.now();ex={r,i:0,ans,end:Date.parse(r.ends_at)-off,leaves:r.leaves||0,flags:loadFlags(r.attempt_id),cs:{e:"",r:"",deg:true,ans:0,fresh:false},nav:false,calc:false,warn:""};st.step="run";clearInterval(timer);timer=setInterval(()=>ex&&tick(),1e3);render()},
 pick(d){ex.ans[ex.i]=+d.j;keepAns();render()},
 next(){ex.i++;ex.warn="";render()},prev(){ex.i--;ex.warn="";render()},
 goq(d){ex.i=+d.i;ex.warn="";render()},
 qnav(){ex.nav=!ex.nav;render()},
 flag(){ex.flags[ex.i]=!ex.flags[ex.i];try{localStorage.setItem("cbt-flg-"+ex.r.attempt_id,JSON.stringify(ex.flags))}catch(e){}render()},
 calc(){ex.calc=!ex.calc;render()},
 ck(d){const c=ex.cs,k=d.k,E=$("#cE"),Rr=$("#cR");
  if(k==="deg"){c.deg=!c.deg;const b=$("#cDeg");if(b)b.textContent=c.deg?"DEG":"RAD";return}
  if(k==="C"){c.e="";c.r="";c.fresh=false}
  else if(k==="bs"){c.e=c.e.replace(/(sin|cos|tan|log|ln|sqrt|pi|ans)\($|(sin|cos|tan|log|ln|sqrt)\($|pi$|ans$|.$/,"");c.fresh=false}
  else if(k==="="){try{const v=calcEval(c.e,c.deg,c.ans);c.ans=v;c.r=String(+v.toPrecision(10))}catch(e){c.r="Error"}c.fresh=true}
  else{if(c.fresh){c.fresh=false;c.r="";c.e=/^[+\-×÷^%!]|^\^/.test(k)?"ans"+k:k}else c.e+=k}
  if(E)E.textContent=c.e||"\u00a0";if(Rr)Rr.textContent=c.r},

 fin(){const un=ex.r.questions.filter((_,k)=>!ansOk(ex.ans[k])).length;if(confirm(un?"You have "+un+" unanswered question"+(un>1?"s":"")+". Submit your exam now?":"Submit your exam now?"))return finish()},
 again(){st={step:"login"};render()}
};
const rpc2=(n,a)=>db("rpc/"+n,{method:"POST",body:a});
const busyKeys=new Set();
document.addEventListener("click",async ev=>{const b=ev.target.closest("[data-a]");if(!b||!A[b.dataset.a])return;const a=b.dataset.a,key=a+"|"+(b.dataset.id||b.dataset.i||b.dataset.v||"");if(busyKeys.has(key))return;busyKeys.add(key);
 const sub=/fin|submit|finish/i.test(a),inExam=typeof ex!=="undefined"&&ex&&Array.isArray(ex.ans)&&!sub;
 LDR.label=sub?"Submitting, please wait":/^signin$/i.test(a)?"Signing you in, please wait":null;
 if(!inExam){LDR.act++;LDR.sync()}const kt=setTimeout(()=>busyKeys.delete(key),30000);
 try{await A[a](b.dataset)}catch(e){note(e.message,1);render()}finally{clearTimeout(kt);busyKeys.delete(key);if(!inExam){LDR.act--;LDR.sync()}LDR.label=null}});
